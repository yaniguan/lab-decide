[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-decide"
version = "0.2.0"
description = "Calibrated conformal experiment advisor with kNN applicability-domain gating and trust-region Bayesian optimization."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
chem = [
    "rdkit>=2023.9",
]
bo = [
    "lightgbm>=4.0,<5.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "jsonschema>=4.18,<5.0",
]

[project.scripts]
lab-decide = "lab_decide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab_decide = ["resources/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
